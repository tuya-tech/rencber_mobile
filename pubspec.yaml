name: rencber_mobile
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.1.0
  fluttertoast: ^8.2.8
  flutter_form_builder: ^10.1.0
  kartal: ^4.1.0
  upgrader: ^11.3.0
  json_annotation: ^4.9.0
  safe_device: ^1.1.9
  persistent_bottom_nav_bar: ^6.2.1
  dio: ^5.7.0
  riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_svg: ^2.0.14
  sizer: ^3.0.4
  google_fonts: ^6.2.1
  mask_text_input_formatter: ^2.9.0
  table_calendar: ^3.1.2
  intl: ^0.20.2
  easy_localization: ^3.0.7
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1
  cached_network_image: ^3.4.1
  firebase_messaging: ^16.0.0
  firebase_core: ^4.0.0
  flutter_local_notifications: ^19.4.0
  flutter_html: ^3.0.0-beta.2
  scroll_date_picker: ^3.8.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.8.0
  source_gen: ^3.1.0
  build_runner: ^2.4.13
  path_provider: ^2.1.5
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/weather/
    - assets/islemler/
    # - assets/auth/
    # - assets/navbar/
    # - assets/maps/
    - assets/lang/
    - assets/navigation/
  
    # - assets/no_image/
    # - assets/logo/
    # - assets/icon/
